<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1014">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Radiant Panel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@500;600&display=swap">
<style>
/* Layout: one phone-height column. Logo, then the power control, then the
   ceiling panel seen from below carrying the temperature, then the comfort
   controls (Cooler / Off / Warmer) in thumb reach. */
:root {
  color-scheme: dark;
  --bg: #0d1014;
  --surface: #161b21;
  --surface-2: #1e252d;
  --line: #2a333d;
  --fg: #eef2f5;
  --muted: #8d99a6;
  --plate: #ffffff;
  --cool-deep: #0b2a6b;
  --cool: #1f6fe5;
  --cool-edge: #5cc8ff;
  --heat-deep: #5a0f14;
  --heat: #d5382c;
  --heat-edge: #ffa257;
  --idle-deep: #20262d;
  --idle: #3a444f;
  --idle-edge: #77838f;
  --ok: #49c58a;
  --lamp: #ffd166;
  --lamp-deep: #3a2f12;
  --bad: #f0624d;
  --on-accent: #ffffff;
  --shadow: rgba(0, 0, 0, .45);
  --font: "Barlow", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-num: "Barlow Semi Condensed", "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
  --m-deep: var(--cool-deep);
  --m: var(--cool);
  --m-edge: var(--cool-edge);
}
body[data-mode="heating"] { --m-deep: var(--heat-deep); --m: var(--heat); --m-edge: var(--heat-edge); }
body[data-run="idle"]     { --m-deep: var(--idle-deep); --m: var(--idle); --m-edge: var(--idle-edge); }

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font: 400 16px/1.4 var(--font);
  -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
}
[hidden] { display: none !important; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 2px solid var(--m-edge); outline-offset: 2px; }
button:disabled { cursor: default; }

.app {
  max-width: 460px; margin: 0 auto; min-height: 100%;
  padding-inline: 16px;
  padding-block: calc(env(safe-area-inset-top, 0px) + 12px) calc(env(safe-area-inset-bottom, 0px) + 20px);
  display: flex; flex-direction: column; gap: 14px;
}

/* ── header ── */
.top { display: flex; align-items: center; gap: 12px; }
.logo { text-decoration: none; background: var(--plate); border-radius: 10px; padding: 6px 10px; display: inline-flex; align-items: center; min-height: 40px; }
.logo img { display: block; height: 28px; width: auto; max-width: 180px; }
.logo .word { font: 600 1.05rem/1 var(--font-num); letter-spacing: .03em; color: var(--cool-deep); }
.top h1 { margin: 0; flex: 1; text-align: right; font: 600 .78rem/1 var(--font); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }

/* ── power: split when off, single bar when on ── */
.power-off { display: grid; grid-template-columns: 1fr 1fr; gap: 0; border-radius: 16px; overflow: hidden; border: 1.5px solid var(--line); }
.power-off button {
  min-height: 62px; border: 0; display: flex; align-items: center; justify-content: center; gap: 10px;
  font: 600 1.15rem/1 var(--font-num); letter-spacing: .05em; text-transform: uppercase; color: var(--on-accent);
}
.power-off button svg { width: 22px; height: 22px; }
.power-off .p-cool { background: linear-gradient(135deg, var(--cool-deep), var(--cool)); }
.power-off .p-heat { background: linear-gradient(135deg, var(--heat-deep), var(--heat)); border-left: 1.5px solid var(--bg); }
.power-cap { margin: -6px 2px 0; text-align: center; color: var(--muted); font-size: .85rem; }

.power-on {
  display: flex; align-items: center; gap: 12px; width: 100%; min-height: 62px; padding: 0 16px;
  border-radius: 16px; border: 0; color: var(--on-accent);
  background: linear-gradient(135deg, var(--m-deep), var(--m));
}
.power-on svg { width: 24px; height: 24px; flex: none; }
.power-on .pw-state { font: 600 1.3rem/1 var(--font-num); letter-spacing: .06em; text-transform: uppercase; flex: 1; text-align: left; }
.power-on .pw-act { display: inline-flex; align-items: center; gap: 6px; font-size: .85rem; opacity: .9; }
.power-wait { min-height: 62px; border-radius: 16px; border: 1.5px dashed var(--line); display: grid; place-items: center; color: var(--muted); font-size: .92rem; }

/* ── panel hero ── */
.hero { position: relative; margin-inline: -4px; }
.hero svg { display: block; width: 100%; height: auto; }
.hero .glow { transition: opacity .6s; }
.reading { position: absolute; left: 0; right: 0; top: 17%; text-align: center; color: var(--on-accent); pointer-events: none; text-shadow: 0 2px 14px var(--shadow); }
.reading .label { font-size: .72rem; font-weight: 600; letter-spacing: .16em; text-transform: uppercase; opacity: .85; }
.reading .temp { font: 600 clamp(3.4rem, 19vw, 4.9rem)/1 var(--font-num); font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.reading .temp small { font-size: .42em; font-weight: 500; vertical-align: .72em; margin-left: .08em; opacity: .9; }
.status { text-align: center; margin-top: -6px; min-height: 2.8em; }
.status b { display: block; font: 600 1.05rem/1.3 var(--font-num); letter-spacing: .02em; }
.status span { color: var(--muted); font-size: .9rem; }
@media (prefers-reduced-motion: no-preference) {
  body[data-run="running"] .hero .glow { animation: breathe 5s ease-in-out infinite; }
  @keyframes breathe { 0%, 100% { opacity: .55; } 50% { opacity: 1; } }
}

/* ── comfort card ── */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 14px; }
.card h2 { margin: 0 0 6px; font-size: .72rem; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.sp { text-align: center; font: 600 3rem/1.1 var(--font-num); font-variant-numeric: tabular-nums; color: var(--m-edge); transition: color .25s; }
.sp small { font-size: .42em; font-weight: 500; color: var(--muted); margin-left: .1em; }
.comfort { display: grid; grid-template-columns: 1fr 1.15fr 1fr; gap: 8px; margin-top: 12px; }
.comfort button {
  min-height: 64px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface-2);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
  font: 600 1rem/1.1 var(--font-num); letter-spacing: .03em; padding: 6px;
}
.comfort button svg { width: 20px; height: 20px; }
.comfort .b-cool { color: var(--cool-edge); }
.comfort .b-heat { color: var(--heat-edge); }
.comfort .b-off { color: var(--fg); font-size: .92rem; }
.comfort button:active:not(:disabled) { background: var(--line); }
.comfort button:disabled { opacity: .35; }

.lights {
  display: flex; align-items: center; gap: 12px; width: 100%; min-height: 58px; padding: 0 16px;
  border-radius: 16px; border: 1px solid var(--line); background: var(--surface); color: var(--muted);
  transition: background .25s, border-color .25s, color .25s;
}
.lights svg { width: 24px; height: 24px; flex: none; }
.lights .l-name { flex: 1; text-align: left; font: 600 1.15rem/1 var(--font-num); letter-spacing: .05em; text-transform: uppercase; color: var(--fg); }
.lights .l-state { font: 600 1rem/1 var(--font-num); letter-spacing: .06em; text-transform: uppercase; }
.lights[aria-pressed="true"] { background: var(--lamp-deep); border-color: var(--lamp); color: var(--lamp); }
.lights[aria-pressed="true"] svg { filter: drop-shadow(0 0 6px var(--lamp)); }
.lights:disabled { opacity: .5; }

.tiles { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; min-width: 0; }
.tile span { display: block; font-size: .68rem; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.tile b { font: 600 1.7rem/1.3 var(--font-num); font-variant-numeric: tabular-nums; white-space: nowrap; }
.tile.cold b { color: var(--cool-edge); }
.tile.hot b { color: var(--heat-edge); }
.foot { text-align: center; color: var(--muted); font-size: .8rem; }

.busy .power-off button, .busy .power-on { pointer-events: none; opacity: .6; }

.toast {
  position: fixed; left: 16px; right: 16px; bottom: calc(env(safe-area-inset-bottom, 0px) + 16px);
  max-width: 428px; margin: 0 auto; padding: 12px 14px; border-radius: 12px;
  background: var(--surface-2); border: 1px solid var(--line); box-shadow: 0 8px 30px var(--shadow);
  font-size: .92rem; z-index: 30;
}
.toast.bad { border-color: var(--bad); }
</style>
</head>
<body data-mode="cooling" data-run="idle">
<div class="app" id="app">

  <header class="top">
    <a class="logo" href="https://www.clearly-cool.com" target="_blank" rel="noopener">
      <img id="logoImg" src="https://www.clearly-cool.com/photos/logo.png" alt="Clearly Cool" onerror="this.hidden=true;document.getElementById('logoWord').hidden=false">
      <span class="word" id="logoWord" hidden>Clearly Cool</span>
    </a>
    <h1>Radiant Panel</h1>
  </header>

  <!-- power: waiting / off (pick a mode) / on (shows mode, tap to turn off) -->
  <div class="power-wait" id="pwWait">Connecting to the panel</div>
  <div id="pwOff" hidden>
    <div class="power-off" role="group" aria-label="Turn on">
      <button class="p-cool" id="startCool">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M12 3v18M4.2 7.5l15.6 9M19.8 7.5l-15.6 9M9.5 4.5 12 7l2.5-2.5M9.5 19.5 12 17l2.5 2.5"/></svg>
        Cooling
      </button>
      <button class="p-heat" id="startHeat">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 3v2.5M12 18.5V21M3 12h2.5M18.5 12H21M5.6 5.6l1.8 1.8M16.6 16.6l1.8 1.8M18.4 5.6l-1.8 1.8M7.4 16.6l-1.8 1.8"/></svg>
        Heating
      </button>
    </div>
  </div>
  <p class="power-cap" id="pwCap" hidden>System is off. Tap a side to turn it on.</p>
  <button class="power-on" id="pwOn" hidden>
    <svg id="pwIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"></svg>
    <span class="pw-state" id="pwState">Cooling</span>
    <span class="pw-act">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true" style="width:16px;height:16px"><path d="M12 3v8"/><path d="M6.3 6.8a8 8 0 1 0 11.4 0"/></svg>
      Tap to turn off
    </span>
  </button>

  <section class="hero" aria-live="polite">
    <svg viewBox="0 0 360 250" role="img" aria-label="Ceiling radiant panel seen from below">
      <defs>
        <linearGradient id="gFace" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="var(--m-deep)"/>
          <stop offset=".55" stop-color="var(--m)"/>
          <stop offset="1" stop-color="var(--m-edge)"/>
        </linearGradient>
        <radialGradient id="gWash" cx=".5" cy="0" r="1" gradientTransform="matrix(1 0 0 .9 0 0)">
          <stop offset="0" stop-color="var(--m)" stop-opacity=".55"/>
          <stop offset=".6" stop-color="var(--m)" stop-opacity=".12"/>
          <stop offset="1" stop-color="var(--m)" stop-opacity="0"/>
        </radialGradient>
        <filter id="fBlur" x="-20%" y="-40%" width="140%" height="180%"><feGaussianBlur stdDeviation="5"/></filter>
        <clipPath id="cFace"><path d="M14 22 H346 L306 168 H54 Z"/></clipPath>
      </defs>
      <path class="glow" d="M54 168 H306 L352 250 H8 Z" fill="url(#gWash)"/>
      <rect x="10" y="8" width="340" height="14" rx="2" fill="var(--surface-2)" stroke="var(--line)"/>
      <rect x="98" y="4" width="26" height="6" rx="2" fill="var(--line)"/>
      <rect x="236" y="4" width="26" height="6" rx="2" fill="var(--line)"/>
      <path d="M14 22 H346 L306 168 H54 Z" fill="url(#gFace)"/>
      <g id="mesh" clip-path="url(#cFace)" stroke="var(--on-accent)" stroke-opacity=".13" stroke-width=".6" fill="none"></g>
      <path class="glow" d="M14 22 H346 L306 168 H54 Z" fill="none" stroke="var(--m-edge)" stroke-width="5" filter="url(#fBlur)"/>
      <path d="M14 22 H346 L306 168 H54 Z" fill="none" stroke="var(--m-edge)" stroke-width="1.6" stroke-linejoin="round"/>
    </svg>
    <div class="reading">
      <div class="label">Panel temperature</div>
      <div class="temp"><span id="temp">--</span><small>°C</small></div>
    </div>
    <div class="status"><b id="stHead">&nbsp;</b><span id="stSub">&nbsp;</span></div>
  </section>

  <section class="card">
    <h2>Setpoint</h2>
    <div class="sp"><span id="spVal">--</span><small>°C</small></div>
    <div class="comfort">
      <button class="b-cool" id="btnCooler" aria-label="Cooler">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
        Cooler
      </button>
      <button class="b-off" id="btnOff">Off, I feel good!</button>
      <button class="b-heat" id="btnWarmer" aria-label="Warmer">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 15l6-6 6 6"/></svg>
        Warmer
      </button>
    </div>
  </section>

  <button class="lights" id="btnLights" aria-pressed="false" disabled>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.6 10.8c.6.5 1 1.2 1.1 2V16h5v-.2c.1-.8.5-1.5 1.1-2A6 6 0 0 0 12 3z"/></svg>
    <span class="l-name">Lights</span>
    <span class="l-state" id="lightsState">--</span>
  </button>

  <section class="tiles">
    <div class="tile cold"><span>Cold side</span><b id="tCold">--</b></div>
    <div class="tile hot"><span>Hot side</span><b id="tHot">--</b></div>
  </section>

  <div class="foot" id="foot">&nbsp;</div>
</div>

<div class="toast" id="toast" hidden></div>

<script>
(function () {
  "use strict";
  var API = "https://api.particle.io/v1";
  var STALE_MS = 150000;     // firmware publishes every 60 s
  var STEP = 1.0, BAND = 5.0, SP_MIN = 0, SP_MAX = 50;   // must match the firmware

  // Built-in connection. Anyone who has this file can control the device.
  var cfg = {
    token: "adbdaf8741bffcd7b6d90cbc0c9224bdf3072591",
    device: "e00fce6866d2eef41ddbb73d",
    event: "panelLog"
  };

  var $ = function (id) { return document.getElementById(id); };
  var ICON_COOL = '<path d="M12 3v18M4.2 7.5l15.6 9M19.8 7.5l-15.6 9M9.5 4.5 12 7l2.5-2.5M9.5 19.5 12 17l2.5 2.5"/>';
  var ICON_HEAT = '<circle cx="12" cy="12" r="4"/><path d="M12 3v2.5M12 18.5V21M3 12h2.5M18.5 12H21M5.6 5.6l1.8 1.8M16.6 16.6l1.8 1.8M18.4 5.6l-1.8 1.8M7.4 16.6l-1.8 1.8"/>';


  // ── state ────────────────────────────────────────────────────────────────
  var s = { mode: null, state: null, enabled: null, setpoint: null, ambient: null, lights: null,
            panel: null, liquid: null, rpm: null, at: null };
  var conn = "wait";
  var es = null;

  // ── rendering ────────────────────────────────────────────────────────────
  function fmt(v, d) { return (typeof v === "number" && isFinite(v)) ? v.toFixed(d) : "--"; }
  function half(v) { return Math.round(v * 2) / 2; }

  function render() {
    var heating = s.mode === "heating";
    var on = s.enabled === true;
    document.body.dataset.mode = heating ? "heating" : "cooling";
    document.body.dataset.run = !on || s.state === "fault" ? "idle" : (s.state === "running" ? "running" : "rest");

    // power control
    $("pwWait").hidden = s.enabled !== null;
    $("pwOff").hidden = s.enabled !== false;
    $("pwCap").hidden = s.enabled !== false;
    $("pwOn").hidden = !on;
    $("pwState").textContent = heating ? "Heating" : "Cooling";
    $("pwIcon").innerHTML = heating ? ICON_HEAT : ICON_COOL;

    $("temp").textContent = fmt(s.panel, 1);

    var head = " ", sub = " ";
    var verb = heating ? "Heating" : "Cooling";
    if (s.enabled === false) { head = "System is off"; sub = "Tap Cooling or Heating to turn it on"; }
    else if (s.state === "running") { head = verb + " to " + fmt(s.setpoint, 1) + "°C"; sub = "Compressor running at " + Math.round(s.rpm || 0).toLocaleString() + " RPM"; }
    else if (s.state === "lockout") { head = verb + " to " + fmt(s.setpoint, 1) + "°C"; sub = "Compressor is paused and will restart shortly"; }
    else if (s.state === "off") { head = "At setpoint"; sub = "Compressor restarts when the panel drifts from " + fmt(s.setpoint, 1) + "°C"; }
    else if (s.state === "fault") { head = "Fault"; sub = "A sensor or the speed controller is not responding. Compressor stopped."; }
    else if (s.enabled === null) { head = "Waiting for the panel"; sub = "The first reading can take up to a minute"; }
    $("stHead").textContent = head;
    $("stSub").textContent = sub;

    $("spVal").textContent = fmt(s.setpoint, 1);
    var canAdjust = on && typeof s.setpoint === "number";
    $("btnCooler").disabled = !canAdjust;
    $("btnWarmer").disabled = !canAdjust;
    $("btnOff").disabled = !on;


    var lb = $("btnLights");
    lb.disabled = s.lights === null || lightsBusy;
    lb.setAttribute("aria-pressed", String(s.lights === true));
    $("lightsState").textContent = s.lights === null ? "--" : (s.lights ? "On" : "Off");

    // Cold side = A1 (panel_temp) in cooling, A0 (liquid) in heating
    var coldV = heating ? s.liquid : s.panel, hotV = heating ? s.panel : s.liquid;
    $("tCold").textContent = typeof coldV === "number" ? coldV.toFixed(1) + "°C" : "--";
    $("tHot").textContent  = typeof hotV === "number" ? hotV.toFixed(1) + "°C" : "--";

    renderConn();
  }

  function renderConn() {
    var foot = $("foot");
    var age = s.at ? Date.now() - s.at : null;
    var c = conn;
    if (c === "live" && age !== null && age > STALE_MS) c = "stale";
    var ago = "";
    if (age !== null) { var sec = Math.round(age / 1000); ago = sec < 5 ? "just now" : sec < 90 ? sec + " s ago" : Math.round(sec / 60) + " min ago"; }
    if (c === "bad") foot.textContent = "Offline. Trying to reconnect." + (ago ? " Last reading " + ago + "." : "");
    else if (age === null) foot.textContent = "Connecting to the panel";
    else if (c === "stale") foot.textContent = "No new reading. Last one was " + ago + ".";
    else foot.textContent = "Updated " + ago;
  }

  var toastTimer = null;
  function toast(msg, bad) {
    var t = $("toast");
    t.textContent = msg; t.classList.toggle("bad", !!bad); t.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.hidden = true; }, bad ? 5000 : 3500);
  }

  (function mesh() {
    var g = $("mesh"), d = "", i, t;
    for (i = 1; i < 24; i++) { t = i / 24; d += "M" + (14 + 332 * t).toFixed(1) + " 22L" + (54 + 252 * t).toFixed(1) + " 168"; }
    for (i = 1; i < 12; i++) { t = Math.pow(i / 12, 0.85); var y = 22 + 146 * t; d += "M" + (14 + 40 * t).toFixed(1) + " " + y.toFixed(1) + "H" + (346 - 40 * t).toFixed(1); }
    var p = document.createElementNS("http://www.w3.org/2000/svg", "path");
    p.setAttribute("d", d); g.appendChild(p);
  })();

  // ── Particle cloud ───────────────────────────────────────────────────────
  function dev() { return API + "/devices/" + encodeURIComponent(cfg.device); }
  function auth() { return { Authorization: "Bearer " + cfg.token }; }

  function callFn(name, arg) {
    return fetch(dev() + "/" + name, {
      method: "POST",
      headers: Object.assign({ "Content-Type": "application/x-www-form-urlencoded" }, auth()),
      body: "arg=" + encodeURIComponent(arg)
    }).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (j) {
        if (!r.ok) { var e = new Error(j.error || ("HTTP " + r.status)); e.status = r.status; throw e; }
        return j.return_value;
      });
    });
  }
  function getVar(name) {
    return fetch(dev() + "/" + name, { headers: auth() }).then(function (r) {
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.json();
    }).then(function (j) { return j.result; });
  }
  function failMsg(e) {
    return e && (e.status === 401 || e.status === 403) ? "Particle did not accept the access token." :
      "Could not reach the panel. Check that it is powered and online.";
  }

  function applyEvent(d) {
    var num = function (v) { return typeof v === "number" ? v : null; };
    if (d.mode === "heating" || d.mode === "cooling") s.mode = d.mode;
    if (typeof d.state === "string") s.state = d.state;
    if (typeof d.enabled === "boolean") s.enabled = d.enabled;
    if (typeof d.lights === "boolean" && !lightsBusy) s.lights = d.lights;
    if (!queue.length && !sending && num(d.setpoint) !== null) s.setpoint = d.setpoint;
    s.ambient = num(d.ambient);
    s.panel = num(d.panel_temp);
    s.liquid = num(d.liquid_temp);
    s.rpm = num(d.rpm);
    s.at = Date.now();
    render();
  }

  function connect() {
    Promise.all(["mode", "panelTemp", "setpoint"].map(function (v) { return getVar(v).catch(function () { return null; }); }))
      .then(function (r) {
        if (s.at) return;
        if (r[0] === "heating" || r[0] === "cooling") s.mode = r[0];
        if (typeof r[1] === "number") s.panel = r[1];
        if (typeof r[2] === "number") s.setpoint = r[2];
        if (r[0] !== null) conn = "live";
        render();
      });
    callFn("refresh", "").catch(function () {});

    var url = dev() + "/events/" + encodeURIComponent(cfg.event) + "?access_token=" + encodeURIComponent(cfg.token);
    es = new EventSource(url);
    es.onopen = function () { conn = "live"; renderConn(); };
    es.onerror = function () { conn = "bad"; renderConn(); };
    es.addEventListener(cfg.event, function (e) {
      try {
        var outer = JSON.parse(e.data);
        var d = typeof outer.data === "string" ? JSON.parse(outer.data) : outer.data;
        conn = "live";
        applyEvent(d);
      } catch (err) { /* not our JSON; ignore */ }
    });
  }

  // ── power ────────────────────────────────────────────────────────────────
  function power(name, arg, after) {
    $("app").classList.add("busy");
    callFn(name, arg).then(function (rv) {
      if (rv === -1) { toast("The panel did not accept that.", true); return; }
      after(rv); render();
    }).catch(function (e) { toast(failMsg(e), true); })
      .then(function () { $("app").classList.remove("busy"); });
  }
  function start(mode) {
    power("start", mode, function () {
      s.enabled = true; s.mode = mode === "heat" ? "heating" : "cooling";
      s.setpoint = mode === "heat" ? 30 : 10; s.state = "lockout";
      toast("Turning on in " + s.mode + " at " + s.setpoint.toFixed(0) + "°C. The compressor starts within a few minutes.");
    });
  }
  function turnOff(msg) {
    power("setPower", "off", function () {
      s.enabled = false; s.state = "disabled"; queue = [];
      toast(msg);
    });
  }
  $("startCool").onclick = function () { start("cool"); };
  $("startHeat").onclick = function () { start("heat"); };
  $("pwOn").onclick = function () { turnOff("System turned off."); };
  $("btnOff").onclick = function () { turnOff("Off. Enjoy it."); };

  // ── lights (independent of the heat pump) ──
  var lightsBusy = false;
  $("btnLights").onclick = function () {
    if (s.lights === null) return;
    var want = !s.lights;
    lightsBusy = true; s.lights = want; render();
    callFn("setLights", want ? "on" : "off").then(function (rv) {
      if (rv === 1 || rv === 0) s.lights = rv === 1;
    }).catch(function (e) {
      s.lights = !want;
      toast(failMsg(e), true);
    }).then(function () { lightsBusy = false; render(); });
  };

  // ── warmer / cooler ──────────────────────────────────────────────────────
  // Taps are sent one at a time. The screen updates straight away using the
  // same rule as the firmware, then takes the device's answer.
  var queue = [], sending = false;

  function predict(dir) {
    var sp = s.setpoint + (dir === "warmer" ? STEP : -STEP);
    var heating = s.mode === "heating", switched = false;
    if (typeof s.ambient === "number") {
      var lo = half(s.ambient - BAND), hi = half(s.ambient + BAND);
      if (dir === "warmer" && !heating && sp > lo) { if (sp < hi) sp = hi; heating = true; switched = true; }
      if (dir === "cooler" && heating && sp < hi) { if (sp > lo) sp = lo; heating = false; switched = true; }
    }
    sp = Math.min(SP_MAX, Math.max(SP_MIN, sp));
    s.setpoint = sp;
    if (switched) {
      s.mode = heating ? "heating" : "cooling"; s.state = "lockout";
      toast("Switching to " + s.mode + " at " + sp.toFixed(1) + "°C. The compressor pauses for at least a minute.");
    }
  }

  function nudge(dir) {
    if (typeof s.setpoint !== "number" || s.enabled !== true) return;
    predict(dir);
    queue.push(dir);
    render();
    pump();
  }
  function pump() {
    if (sending || !queue.length) return;
    sending = true;
    var dir = queue.shift();
    callFn("nudge", dir).then(function (rv) {
      if (typeof rv === "number" && rv >= 0 && !queue.length) s.setpoint = rv / 10;
    }).catch(function (e) {
      queue = [];
      toast(failMsg(e), true);
      callFn("refresh", "").catch(function () {});
    }).then(function () { sending = false; render(); pump(); });
  }
  $("btnCooler").onclick = function () { nudge("cooler"); };
  $("btnWarmer").onclick = function () { nudge("warmer"); };

  // ── start ────────────────────────────────────────────────────────────────
  render();
  connect();
  setInterval(renderConn, 5000);
  document.addEventListener("visibilitychange", function () {
    if (!document.hidden) callFn("refresh", "").catch(function () {});
  });
})();
</script>
</body>
</html>
