<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fbfaf8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121110" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Radiant Panel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,600&display=swap">
<style>
/* Calm white thermostat (round dial, thin numerals) above a line-drawn room
   where wavy radiation arrows show heat moving between you and the panel. */
:root {
  color-scheme: light dark;
  --bg:     #fbfaf8;
  --card:   #ffffff;
  --sunk:   #f3f1ed;
  --line:   #e7e3dc;
  --ink:    #1d1b19;
  --dim:    #8c857c;
  --sketch: #b9b2a7;
  --cool:   #2f74b5;
  --cool-lt:#e4eef7;
  --heat:   #b5283b;
  --heat-lt:#f6e1e3;
  --idle:   #8c857c;
  --idle-lt:#efece7;
  --body-a: #f6b04a;
  --body-b: #e5482f;
  --lamp:   #c78a12;
  --lamp-lt:#f8eed6;
  --bad:    #b5283b;
  --shadow: 0 18px 50px rgba(60,40,20,.10), 0 2px 6px rgba(60,40,20,.05);
  --mono: "DM Mono", ui-monospace, monospace;
  --sans: "DM Sans", system-ui, -apple-system, sans-serif;
  --cool-fill: #6fa8dc; --heat-fill: #e0606d; --idle-fill: #d9d4cc;
  --m: var(--cool); --m-lt: var(--cool-lt); --m-fill: var(--cool-fill);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #121110; --card: #1b1a18; --sunk: #232120; --line: #312e2a;
    --ink: #f2eee8; --dim: #9a9389; --sketch: #57524b;
    --cool: #74a9dc; --cool-lt: #1a2733;
    --heat: #e5707e; --heat-lt: #36191d;
    --idle: #9a9389; --idle-lt: #24221f;
    --lamp: #e9b44c; --lamp-lt: #33290f;
    --bad: #ef7a87;
    --cool-fill: #2f6ea6; --heat-fill: #a83846; --idle-fill: #3a3631;
    --shadow: 0 18px 50px rgba(0,0,0,.45), 0 2px 6px rgba(0,0,0,.3);
  }
}
body[data-mode="heating"] { --m: var(--heat); --m-lt: var(--heat-lt); --m-fill: var(--heat-fill); }
body[data-run="idle"]     { --m: var(--idle); --m-lt: var(--idle-lt); --m-fill: var(--idle-fill); }

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 400 16px/1.45 var(--sans);
  -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
}
[hidden] { display: none !important; }
button { font: inherit; color: inherit; cursor: pointer; background: none; }
button:focus-visible { outline: 2px solid var(--m); outline-offset: 3px; }
button:disabled { cursor: default; }

.app {
  max-width: 440px; margin: 0 auto; min-height: 100%;
  padding-inline: 16px;
  padding-block: calc(env(safe-area-inset-top, 0px) + 10px) calc(env(safe-area-inset-bottom, 0px) + 22px);
  display: flex; flex-direction: column; gap: 14px;
}
.lbl { font: 400 .7rem/1.2 var(--sans); letter-spacing: .04em; color: var(--dim); }

/* ── top bar ── */
.top { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; min-height: 40px; }
.logo { justify-self: start; text-decoration: none; display: inline-flex; align-items: center; }
.logo img { display: block; height: 22px; width: auto; max-width: 120px; }
.logo .word { font: 600 .9rem/1 var(--sans); color: var(--ink); }
.top h1 { margin: 0; font: 400 .95rem/1 var(--sans); color: var(--ink); }

/* ── power ── */
.power-off { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.power-off button {
  min-height: 52px; border-radius: 26px; display: flex; align-items: center; justify-content: center; gap: 8px;
  font: 600 .95rem/1 var(--sans); border: 1px solid var(--line); background: var(--card); box-shadow: var(--shadow);
}
.power-off button svg { width: 18px; height: 18px; }
.power-off .p-cool { color: var(--cool); }
.power-off .p-heat { color: var(--heat); }
.power-cap { margin: -4px 0 0; text-align: center; color: var(--dim); font-size: .82rem; }
.power-on {
  align-self: center; display: inline-flex; align-items: center; gap: 8px; min-height: 36px; padding: 0 14px 0 12px;
  border-radius: 18px; border: 1px solid var(--line); background: var(--card); color: var(--ink);
}
.power-on svg { width: 16px; height: 16px; flex: none; color: var(--m); }
.power-on .pw-state { font: 600 .82rem/1 var(--sans); }
.power-on .pw-act { display: inline-flex; align-items: center; gap: 5px; font-size: .78rem; color: var(--dim); padding-left: 8px; border-left: 1px solid var(--line); }
.power-on .pw-act svg { color: var(--dim); }
.power-wait { min-height: 36px; display: grid; place-items: center; color: var(--dim); font-size: .85rem; }

/* ── dial ── */
.dial-wrap { display: grid; place-items: center; padding: 6px 0 2px; }
.dial {
  position: relative; width: min(84vw, 330px); aspect-ratio: 1; border-radius: 50%;
  background: var(--card); box-shadow: var(--shadow);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
  text-align: center; padding: 0 22px;
}
.dial::before { content: ""; position: absolute; inset: 10px; border-radius: 50%; border: 1px solid var(--line); pointer-events: none; }
.dial-ic { width: 26px; height: 26px; color: var(--m); transition: color .3s; }
.dial-ic svg { display: none; width: 100%; height: 100%; }
body[data-mode="cooling"] .ic-cool, body[data-mode="heating"] .ic-heat { display: block; }
body[data-state="fault"] .ic-cool, body[data-state="fault"] .ic-heat { display: none; }
body[data-state="fault"] .ic-fault { display: block; color: var(--bad); }
#stHead { font: 600 1rem/1.25 var(--sans); max-width: 15em; }
body[data-state="fault"] #stHead { color: var(--bad); }
.pair { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; width: 100%; margin-top: 10px; }
.pair > div { display: flex; flex-direction: column; align-items: center; gap: 2px; }
.pair > div + div { border-left: 1px solid var(--line); }
.num { font: 300 clamp(2.3rem, 12vw, 2.9rem)/1 var(--sans); letter-spacing: -.03em; font-variant-numeric: tabular-nums; color: var(--m); transition: color .3s; }
.num small { font-size: .36em; font-weight: 400; vertical-align: 1.5em; margin-left: .1em; letter-spacing: 0; }
.mini { display: flex; gap: 22px; margin-top: 14px; }
.mini > div { display: flex; flex-direction: column; align-items: center; gap: 3px; }
.mini svg { width: 17px; height: 17px; color: var(--dim); }
.mini b { font: 400 .74rem/1 var(--mono); color: var(--dim); white-space: nowrap; }
.status-sub { text-align: center; color: var(--dim); font-size: .86rem; min-height: 1.4em; margin: 0 8px; }
body[data-state="fault"] .status-sub { color: var(--ink); }

/* ── room scene ── */
.scene { position: relative; background: var(--card); border: 1px solid var(--line); border-radius: 18px; overflow: hidden; }
.scene svg { display: block; width: 100%; height: auto; }
.sk { stroke: var(--sketch); stroke-width: .8; fill: none; stroke-linecap: round; }
.sk-faint { stroke: var(--sketch); stroke-width: .5; fill: none; opacity: .55; }
.panel-face { fill: var(--m-fill); stroke: var(--ink); stroke-width: 1; transition: fill .6s; }
.panel-glow { fill: var(--m-fill); opacity: .35; filter: blur(6px); transition: fill .6s, opacity .6s; }
body[data-run="idle"] .panel-glow { opacity: 0; }
.leader { stroke-width: .8; fill: none; }
.tag { font: 600 9.5px/1 var(--sans); fill: var(--ink); }
.tag-sub { font: 400 8px/1 var(--sans); fill: var(--dim); }
.waves path { fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.w-up path { stroke: url(#gWarm); }
.w-dn path { stroke: var(--heat); }
.w-up, .w-dn { display: none; }
body[data-mode="cooling"] .w-up, body[data-mode="heating"] .w-dn { display: inline; }
body[data-run="idle"] .waves { opacity: .2; filter: grayscale(1); }
body[data-run="rest"] .waves { opacity: .5; }
.only-cool, .only-heat { display: none; }
body[data-mode="cooling"] .only-cool, body[data-mode="heating"] .only-heat { display: inline; }
@media (prefers-reduced-motion: no-preference) {
  .waves path { stroke-dasharray: 14 6; }
  body[data-run="running"] .waves path { animation: flow 1.1s linear infinite; }
  @keyframes flow { to { stroke-dashoffset: -20; } }
}

/* ── controls ── */
.comfort { display: grid; grid-template-columns: 1fr 1.25fr 1fr; gap: 10px; }
.comfort button {
  min-height: 58px; border-radius: 16px; border: 1px solid var(--line); background: var(--card);
  display: flex; align-items: center; justify-content: center; gap: 6px; padding: 6px;
  font: 600 .95rem/1.1 var(--sans);
}
.comfort button svg { width: 18px; height: 18px; flex: none; }
.comfort .b-cool { color: var(--cool); }
.comfort .b-heat { color: var(--heat); }
.comfort .b-off { color: var(--ink); font-weight: 400; font-size: .86rem; background: var(--sunk); }
.comfort button:active:not(:disabled) { background: var(--sunk); }
.comfort button:disabled { opacity: .35; }

.lights {
  display: flex; align-items: center; gap: 12px; width: 100%; min-height: 52px; padding: 0 16px;
  border-radius: 16px; border: 1px solid var(--line); background: var(--card); color: var(--dim);
  transition: background .25s, border-color .25s, color .25s;
}
.lights svg { width: 20px; height: 20px; flex: none; }
.lights .l-name { flex: 1; text-align: left; font: 600 .95rem/1 var(--sans); color: var(--ink); }
.lights .l-state { font: 400 .8rem/1 var(--mono); }
.lights[aria-pressed="true"] { background: var(--lamp-lt); border-color: var(--lamp); color: var(--lamp); }
.lights:disabled { opacity: .5; }

.foot { text-align: center; color: var(--dim); font-size: .74rem; }
.busy .power-off button, .busy .power-on { pointer-events: none; opacity: .6; }
.toast {
  position: fixed; left: 16px; right: 16px; bottom: calc(env(safe-area-inset-bottom, 0px) + 16px);
  max-width: 408px; margin: 0 auto; padding: 12px 16px; border-radius: 14px;
  background: var(--ink); color: var(--bg); box-shadow: 0 10px 30px rgba(0,0,0,.2);
  font-size: .9rem; z-index: 60;
}
.toast.bad { background: var(--bad); color: #fff; }
</style>
</head>
<body data-mode="cooling" data-run="idle">
<div class="app" id="app">

  <header class="top">
    <a class="logo" href="https://www.clearly-cool.com" target="_blank" rel="noopener">
      <img id="logoImg" src="https://www.clearly-cool.com/photos/logo.png" alt="Clearly Cool" onerror="this.hidden=true;document.getElementById('logoWord').hidden=false">
      <span class="word" id="logoWord" hidden>Clearly Cool</span>
    </a>
    <h1>Radiant panel</h1>
    <span></span>
  </header>

  <!-- power: waiting / off (pick a mode) / on (shows mode, tap to turn off) -->
  <div class="power-wait" id="pwWait">Connecting to the panel…</div>
  <div id="pwOff" hidden>
    <div class="power-off" role="group" aria-label="Turn on">
      <button class="p-cool" id="startCool">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M12 3v18M4.2 7.5l15.6 9M19.8 7.5l-15.6 9M9.5 4.5 12 7l2.5-2.5M9.5 19.5 12 17l2.5 2.5"/></svg>
        Cooling
      </button>
      <button class="p-heat" id="startHeat">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 3v2.5M12 18.5V21M3 12h2.5M18.5 12H21M5.6 5.6l1.8 1.8M16.6 16.6l1.8 1.8M18.4 5.6l-1.8 1.8M7.4 16.6l-1.8 1.8"/></svg>
        Heating
      </button>
    </div>
  </div>
  <p class="power-cap" id="pwCap" hidden>System is off. Pick a mode to turn it on.</p>
  <button class="power-on" id="pwOn" hidden>
    <svg id="pwIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"></svg>
    <span class="pw-state" id="pwState">Cooling</span>
    <span class="pw-act">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true" style="width:13px;height:13px"><path d="M12 3v8"/><path d="M6.3 6.8a8 8 0 1 0 11.4 0"/></svg>
      Turn off
    </span>
  </button>

  <section class="dial-wrap" aria-live="polite">
    <div class="dial">
      <div class="dial-ic" aria-hidden="true">
        <svg class="ic-cool" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M12 3v18M4.2 7.5l15.6 9M19.8 7.5l-15.6 9M9.5 4.5 12 7l2.5-2.5M9.5 19.5 12 17l2.5 2.5"/></svg>
        <svg class="ic-heat" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 3v2.5M12 18.5V21M3 12h2.5M18.5 12H21M5.6 5.6l1.8 1.8M16.6 16.6l1.8 1.8M18.4 5.6l-1.8 1.8M7.4 16.6l-1.8 1.8"/></svg>
        <svg class="ic-fault" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4 21 20H3z"/><path d="M12 10v4.5M12 17.4v.1"/></svg>
      </div>
      <b id="stHead">&nbsp;</b>
      <div class="pair">
        <div><span class="lbl">Panel</span><span class="num"><span id="temp">--</span><small>°C</small></span></div>
        <div><span class="lbl">Setpoint</span><span class="num"><span id="spVal">--</span><small>°C</small></span></div>
      </div>
      <div class="mini">
        <div title="Cold side">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M12 3v18M4.2 7.5l15.6 9M19.8 7.5l-15.6 9"/></svg>
          <b id="tCold">--</b>
        </div>
        <div title="Hot side">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 3v2.5M12 18.5V21M3 12h2.5M18.5 12H21M5.6 5.6l1.8 1.8M16.6 16.6l1.8 1.8M18.4 5.6l-1.8 1.8M7.4 16.6l-1.8 1.8"/></svg>
          <b id="tHot">--</b>
        </div>
      </div>
    </div>
  </section>
  <p class="status-sub" id="stSub">&nbsp;</p>

  <section class="scene" aria-hidden="true">
    <svg viewBox="0 0 360 220">
      <defs>
        <linearGradient id="gBody" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="var(--body-b)"/><stop offset=".55" stop-color="#ee7a3a"/><stop offset="1" stop-color="var(--body-a)"/>
        </linearGradient>
        <linearGradient id="gWarm" x1="0" y1="1" x2="0" y2="0">
          <stop offset="0" stop-color="var(--body-b)"/><stop offset="1" stop-color="var(--body-a)"/>
        </linearGradient>
        <marker id="aUp" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="var(--body-a)"/></marker>
        <marker id="aDn" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="var(--heat)"/></marker>
      </defs>
      <!-- room, sketched in perspective -->
      <path class="sk" d="M0 26 H360 M40 26 V190 M320 26 V190 M40 190 H320 M40 190 L0 222 M320 190 L360 222"/>
      <path class="sk-faint" d="M110 190 L92 222 M180 190 V222 M250 190 L268 222 M18 206 H342"/>
      <path class="sk-faint" d="M254 66 H306 V180 H254 Z M280 66 V180 M254 122 H306"/>
      <path class="sk-faint" d="M269 176 q-6 -18 4 -30 M277 176 q2 -22 12 -28 M273 176 q-14 -10 -16 -24"/>
      <path class="sk" d="M262 176 h26 l-3 14 h-20z"/>
      <!-- ceiling panel -->
      <path class="sk" d="M126 26 V34 M234 26 V34"/>
      <path class="panel-glow" d="M100 40 H260 L276 62 H84 Z"/>
      <path class="panel-face" d="M108 34 H252 L264 46 H96 Z"/>

<script>
(function () {
  "use strict";
  var API = "https://api.particle.io/v1";
  var STALE_MS = 150000;     // firmware publishes every 60 s
  var STEP = 1.0, BAND = 5.0, SP_MIN = 0, SP_MAX = 50;   // must match the firmware

  // Built-in connection. Anyone who has this file can control the device.
  var cfg = {
    token: "adbdaf8741bffcd7b6d90cbc0c9224bdf3072591",
    device: "e00fce6866d2eef41ddbb73d",
    event: "panelLog"
  };

  var $ = function (id) { return document.getElementById(id); };
  var ICON_COOL = '<path d="M12 3v18M4.2 7.5l15.6 9M19.8 7.5l-15.6 9M9.5 4.5 12 7l2.5-2.5M9.5 19.5 12 17l2.5 2.5"/>';
  var ICON_HEAT = '<circle cx="12" cy="12" r="4"/><path d="M12 3v2.5M12 18.5V21M3 12h2.5M18.5 12H21M5.6 5.6l1.8 1.8M16.6 16.6l1.8 1.8M18.4 5.6l-1.8 1.8M7.4 16.6l-1.8 1.8"/>';


  // ── state ────────────────────────────────────────────────────────────────
  var s = { mode: null, state: null, enabled: null, setpoint: null, ambient: null, lights: null,
            panel: null, liquid: null, rpm: null, at: null };
  var conn = "wait";
  var es = null;

  // ── rendering ────────────────────────────────────────────────────────────
  function fmt(v, d) { return (typeof v === "number" && isFinite(v)) ? v.toFixed(d) : "--"; }
  function half(v) { return Math.round(v * 2) / 2; }

  function render() {
    var heating = s.mode === "heating";
    var on = s.enabled === true;
    document.body.dataset.mode = heating ? "heating" : "cooling";
    document.body.dataset.run = !on || s.state === "fault" ? "idle" : (s.state === "running" ? "running" : "rest");
    document.body.dataset.state = s.state || "";

    // power control
    $("pwWait").hidden = s.enabled !== null;
    $("pwOff").hidden = s.enabled !== false;
    $("pwCap").hidden = s.enabled !== false;
    $("pwOn").hidden = !on;
    $("pwState").textContent = heating ? "Heating" : "Cooling";
    $("pwIcon").innerHTML = heating ? ICON_HEAT : ICON_COOL;

    $("temp").textContent = fmt(s.panel, 1);

    var head = " ", sub = " ";
    var verb = heating ? "Heating" : "Cooling";
    if (s.enabled === false) { head = "System is off"; sub = "Tap Cooling or Heating to turn it on"; }
    else if (s.state === "running") { head = verb + " to " + fmt(s.setpoint, 1) + "°C"; sub = "Compressor running at " + Math.round(s.rpm || 0).toLocaleString() + " RPM"; }
    else if (s.state === "lockout") { head = verb + " to " + fmt(s.setpoint, 1) + "°C"; sub = "Compressor is paused and will restart shortly"; }
    else if (s.state === "off") { head = "At setpoint"; sub = "Compressor restarts when the panel drifts from " + fmt(s.setpoint, 1) + "°C"; }
    else if (s.state === "fault") { head = "Fault"; sub = "A sensor or the speed controller is not responding. Compressor stopped."; }
    else if (s.enabled === null) { head = "Waiting for the panel"; sub = "The first reading can take up to a minute"; }
    $("stHead").textContent = head;
    $("stSub").textContent = sub;

    $("spVal").textContent = fmt(s.setpoint, 1);
    var canAdjust = on && typeof s.setpoint === "number";
    $("btnCooler").disabled = !canAdjust;
    $("btnWarmer").disabled = !canAdjust;
    $("btnOff").disabled = !on;


    var lb = $("btnLights");
    lb.disabled = s.lights === null || lightsBusy;
    lb.setAttribute("aria-pressed", String(s.lights === true));
    $("lightsState").textContent = s.lights === null ? "--" : (s.lights ? "On" : "Off");

    // Cold side = A1 (panel_temp) in cooling, A0 (liquid) in heating
    var coldV = heating ? s.liquid : s.panel, hotV = heating ? s.panel : s.liquid;
    $("tCold").textContent = typeof coldV === "number" ? coldV.toFixed(1) + "°C" : "--";
    $("tHot").textContent  = typeof hotV === "number" ? hotV.toFixed(1) + "°C" : "--";

    renderConn();
  }

  function renderConn() {
    var foot = $("foot");
    var age = s.at ? Date.now() - s.at : null;
    var c = conn;
    if (c === "live" && age !== null && age > STALE_MS) c = "stale";
    var ago = "";
    if (age !== null) { var sec = Math.round(age / 1000); ago = sec < 5 ? "just now" : sec < 90 ? sec + " s ago" : Math.round(sec / 60) + " min ago"; }
    if (c === "bad") foot.textContent = "Offline. Trying to reconnect." + (ago ? " Last reading " + ago + "." : "");
    else if (age === null) foot.textContent = "Connecting to the panel";
    else if (c === "stale") foot.textContent = "No new reading. Last one was " + ago + ".";
    else foot.textContent = "Updated " + ago;
  }

  var toastTimer = null;
  function toast(msg, bad) {
    var t = $("toast");
    t.textContent = msg; t.classList.toggle("bad", !!bad); t.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.hidden = true; }, bad ? 5000 : 3500);
  }

  (function mesh() {
    var g = $("mesh"), d = "", i, t;
    for (i = 1; i < 24; i++) { t = i / 24; d += "M" + (14 + 332 * t).toFixed(1) + " 22L" + (54 + 252 * t).toFixed(1) + " 168"; }
    for (i = 1; i < 12; i++) { t = Math.pow(i / 12, 0.85); var y = 22 + 146 * t; d += "M" + (14 + 40 * t).toFixed(1) + " " + y.toFixed(1) + "H" + (346 - 40 * t).toFixed(1); }
    var p = document.createElementNS("http://www.w3.org/2000/svg", "path");
    p.setAttribute("d", d); g.appendChild(p);
  })();

  // ── Particle cloud ───────────────────────────────────────────────────────
  function dev() { return API + "/devices/" + encodeURIComponent(cfg.device); }
  function auth() { return { Authorization: "Bearer " + cfg.token }; }

  function callFn(name, arg) {
    return fetch(dev() + "/" + name, {
      method: "POST",
      headers: Object.assign({ "Content-Type": "application/x-www-form-urlencoded" }, auth()),
      body: "arg=" + encodeURIComponent(arg)
    }).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (j) {
        if (!r.ok) { var e = new Error(j.error || ("HTTP " + r.status)); e.status = r.status; throw e; }
        return j.return_value;
      });
    });
  }
  function getVar(name) {
    return fetch(dev() + "/" + name, { headers: auth() }).then(function (r) {
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.json();
    }).then(function (j) { return j.result; });
  }
  function failMsg(e) {
    return e && (e.status === 401 || e.status === 403) ? "Particle did not accept the access token." :
      "Could not reach the panel. Check that it is powered and online.";
  }

  function applyEvent(d) {
    var num = function (v) { return typeof v === "number" ? v : null; };
    if (d.mode === "heating" || d.mode === "cooling") s.mode = d.mode;
    if (typeof d.state === "string") s.state = d.state;
    if (typeof d.enabled === "boolean") s.enabled = d.enabled;
    if (typeof d.lights === "boolean" && !lightsBusy) s.lights = d.lights;
    if (!queue.length && !sending && num(d.setpoint) !== null) s.setpoint = d.setpoint;
    s.ambient = num(d.ambient);
    s.panel = num(d.panel_temp);
    s.liquid = num(d.liquid_temp);
    s.rpm = num(d.rpm);
    s.at = Date.now();
    render();
  }

  function connect() {
    Promise.all(["mode", "panelTemp", "setpoint"].map(function (v) { return getVar(v).catch(function () { return null; }); }))
      .then(function (r) {
        if (s.at) return;
        if (r[0] === "heating" || r[0] === "cooling") s.mode = r[0];
        if (typeof r[1] === "number") s.panel = r[1];
        if (typeof r[2] === "number") s.setpoint = r[2];
        if (r[0] !== null) conn = "live";
        render();
      });
    callFn("refresh", "").catch(function () {});

    var url = dev() + "/events/" + encodeURIComponent(cfg.event) + "?access_token=" + encodeURIComponent(cfg.token);
    es = new EventSource(url);
    es.onopen = function () { conn = "live"; renderConn(); };
    es.onerror = function () { conn = "bad"; renderConn(); };
    es.addEventListener(cfg.event, function (e) {
      try {
        var outer = JSON.parse(e.data);
        var d = typeof outer.data === "string" ? JSON.parse(outer.data) : outer.data;
        conn = "live";
        applyEvent(d);
      } catch (err) { /* not our JSON; ignore */ }
    });
  }

  // ── power ────────────────────────────────────────────────────────────────
  function power(name, arg, after) {
    $("app").classList.add("busy");
    callFn(name, arg).then(function (rv) {
      if (rv === -1) { toast("The panel did not accept that.", true); return; }
      after(rv); render();
    }).catch(function (e) { toast(failMsg(e), true); })
      .then(function () { $("app").classList.remove("busy"); });
  }
  function start(mode) {
    power("start", mode, function () {
      s.enabled = true; s.mode = mode === "heat" ? "heating" : "cooling";
      s.setpoint = mode === "heat" ? 30 : 10; s.state = "lockout";
      toast("Turning on in " + s.mode + " at " + s.setpoint.toFixed(0) + "°C. The compressor starts within a few minutes.");
    });
  }
  function turnOff(msg) {
    power("setPower", "off", function () {
      s.enabled = false; s.state = "disabled"; queue = [];
      toast(msg);
    });
  }
  $("startCool").onclick = function () { start("cool"); };
  $("startHeat").onclick = function () { start("heat"); };
  $("pwOn").onclick = function () { turnOff("System turned off."); };
  $("btnOff").onclick = function () { turnOff("Off. Enjoy it."); };

  // ── lights (independent of the heat pump) ──
  var lightsBusy = false;
  $("btnLights").onclick = function () {
    if (s.lights === null) return;
    var want = !s.lights;
    lightsBusy = true; s.lights = want; render();
    callFn("setLights", want ? "on" : "off").then(function (rv) {
      if (rv === 1 || rv === 0) s.lights = rv === 1;
    }).catch(function (e) {
      s.lights = !want;
      toast(failMsg(e), true);
    }).then(function () { lightsBusy = false; render(); });
  };

  // ── warmer / cooler ──────────────────────────────────────────────────────
  // Taps are sent one at a time. The screen updates straight away using the
  // same rule as the firmware, then takes the device's answer.
  var queue = [], sending = false;

  function predict(dir) {
    var sp = s.setpoint + (dir === "warmer" ? STEP : -STEP);
    var heating = s.mode === "heating", switched = false;
    if (typeof s.ambient === "number") {
      var lo = half(s.ambient - BAND), hi = half(s.ambient + BAND);
      if (dir === "warmer" && !heating && sp > lo) { if (sp < hi) sp = hi; heating = true; switched = true; }
      if (dir === "cooler" && heating && sp < hi) { if (sp > lo) sp = lo; heating = false; switched = true; }
    }
    sp = Math.min(SP_MAX, Math.max(SP_MIN, sp));
    s.setpoint = sp;
    if (switched) {
      s.mode = heating ? "heating" : "cooling"; s.state = "lockout";
      toast("Switching to " + s.mode + " at " + sp.toFixed(1) + "°C. The compressor pauses for at least a minute.");
    }
  }

  function nudge(dir) {
    if (typeof s.setpoint !== "number" || s.enabled !== true) return;
    predict(dir);
    queue.push(dir);
    render();
    pump();
  }
  function pump() {
    if (sending || !queue.length) return;
    sending = true;
    var dir = queue.shift();
    callFn("nudge", dir).then(function (rv) {
      if (typeof rv === "number" && rv >= 0 && !queue.length) s.setpoint = rv / 10;
    }).catch(function (e) {
      queue = [];
      toast(failMsg(e), true);
      callFn("refresh", "").catch(function () {});
    }).then(function () { sending = false; render(); pump(); });
  }
  $("btnCooler").onclick = function () { nudge("cooler"); };
  $("btnWarmer").onclick = function () { nudge("warmer"); };

  // ── start ────────────────────────────────────────────────────────────────
  render();
  connect();
  setInterval(renderConn, 5000);
  document.addEventListener("visibilitychange", function () {
    if (!document.hidden) callFn("refresh", "").catch(function () {});
  });
})();
</script>
</body>
</html>
